databases:
  - name: atlas-postgres
    plan: free
    databaseName: atlas
    user: atlas

services:
  - type: web
    name: atlas-api-jaycoder7
    runtime: python
    rootDir: apps/api
    plan: free
    autoDeployTrigger: checksPass
    buildCommand: pip install .
    startCommand: alembic upgrade head && python -m atlas.seed --start-date 2026-10-05 && uvicorn atlas.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: atlas-postgres
          property: connectionString
      - key: ATLAS_AUTH_MODE
        value: demo
      - key: ATLAS_DEMO_ORG_ID
        value: org_atlas_demo
      - key: ATLAS_DEMO_ROLE
        value: admin
      - key: CORS_ORIGINS
        value: https://atlas-jaycoder7.onrender.com

  - type: web
    name: atlas-jaycoder7
    runtime: node
    rootDir: apps/web
    plan: free
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: API_INTERNAL_URL
        value: https://atlas-api-jaycoder7.onrender.com/api/v1
      - key: ATLAS_AUTH_MODE
        value: demo
      - key: NEXT_PUBLIC_AUTH_MODE
        value: demo
      - key: APP_BASE_URL
        value: https://atlas-jaycoder7.onrender.com
