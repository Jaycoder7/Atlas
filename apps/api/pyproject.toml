[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas-api"
version = "0.1.0"
description = "Atlas program intelligence API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "pyjwt[crypto]>=2.10,<3",
  "httpx>=0.28,<1",
  "networkx>=3.4,<4",
  "pandas>=2.2,<3",
  "numpy>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<7", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-ignore = ["B008", "BLE001"]
