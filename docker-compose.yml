services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
    ports:
      - "5432:5432"
    volumes:
      - atlas-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://atlas:atlas@postgres:5432/atlas
    command: sh -c "alembic upgrade head && python -m atlas.seed && uvicorn atlas.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./apps/api:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./apps/web
    env_file: .env
    environment:
      API_INTERNAL_URL: http://api:8000/api/v1
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_AUTH_MODE: ${ATLAS_AUTH_MODE:-demo}
    volumes:
      - ./apps/web:/app
      - atlas-node-modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - api

  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    volumes:
      - atlas-ollama:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  atlas-postgres:
  atlas-node-modules:
  atlas-ollama:
